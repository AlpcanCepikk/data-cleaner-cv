[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "data-cleaner-cv"
version = "0.1.0"
description = "Keyboard-driven desktop tool for reviewing, cleaning, editing, and organizing object-detection datasets."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Alpcan Cepik" },
]
keywords = [
    "object-detection", "annotation", "dataset", "yolo", "bounding-box",
    "computer-vision", "data-cleaning", "opencv", "dataset-curation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "opencv-python>=4.5",
    "numpy>=1.20",
    "pandas>=1.3",
]

[project.urls]
Homepage = "https://github.com/AlpcanCepikk/data-cleaner-cv"
Repository = "https://github.com/AlpcanCepikk/data-cleaner-cv"
Issues = "https://github.com/AlpcanCepikk/data-cleaner-cv/issues"

[project.gui-scripts]
data-cleaner-cv = "review:main"

[tool.setuptools]
py-modules = ["review"]
